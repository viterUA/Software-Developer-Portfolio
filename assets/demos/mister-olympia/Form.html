<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Feedback</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
 
  </head>
  <body>
<div class = "box">

<div class="site-header">
<!--I made the logo myself with Phoroshop -->
<a href="#top"><img alt = "Logo" src = "image/Logo.png"></a>

    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span><span></span></button>

    <div class="navigation">
        <a href="Index.html">Home page</a>
        <a href="History.html">Winners</a>
        <a href="Years.html">Competition winners</a>
        <a class="active" href="Form.html">Feedback</a>
    </div>
</div>

        <h1>Feedback Form</h1>
        <h2>We'd love to hear your thoughts on the competition and this website.</h2>

    <div class = "form">

   <form action="mailto:Mykhailo.Hnylytskyi@students.ittralee.ie" method="post" enctype="text/plain">

    <label for="firstname">First name:</label>
        <input type="text" id="firstname" name="firstname">
    <label for="lastname">Last name:</label>
        <input type="text" id="lastname" name="lastname">

    <label>Gender:</label>
    <div class="radio-row">
    <span><input type="radio" id="m" name="fav_language" value="Male">
        <label for="m">Male</label></span>
    <span><input type="radio" id="f" name="fav_language" value="Female">
        <label for="f">Female</label></span>
    </div>

    <label for="email">E-mail:</label>
        <input type="email" id="email" size="30">

        <label for="comment">Comments:</label>
        <textarea id="comment" name="comment" rows="4" cols="30"></textarea>

        <label for="countychooser">County:</label>
        <select id="countychooser" name="countychooser">
          <option value="kerry">Kerry</option>
          <option value="dublin">Dublin</option>
          <option value="galway">Galway</option>
          <option value="cork">Cork</option>
        <option value="mayo">Mayo</option>
          <option value="sligo">Slogi</option>
        </select>

        <input TYPE="submit" value="Send Feedback">
        <input TYPE="reset" value="Reset">

    </form>


    </div>
</div>

<script>
document.querySelectorAll('.nav-toggle').forEach(function(btn){
    btn.addEventListener('click', function(){
        var open = btn.classList.toggle('open');
        document.querySelector('.navigation').classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
    });
});
</script>

  </body>
</html>
